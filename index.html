    <script>
      // Prevent Vite HMR WebSocket connection failure in proxy / iframe environment
      (function() {
        try {
          if (typeof window !== 'undefined' && window.WebSocket) {
            var OrigWebSocket = window.WebSocket;
            window.WebSocket = function(url, protocols) {
              if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
                return {
                  readyState: 1,
                  OPEN: 1,
                  CLOSED: 3,
                  CLOSING: 2,
                  CONNECTING: 0,
                  send: function() {},
                  close: function() {},
                  addEventListener: function(event, handler) {
                    if (event === 'open') setTimeout(handler, 0);
                  },
                  removeEventListener: function() {},
                  dispatchEvent: function() { return true; }
                };
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.OPEN = OrigWebSocket.OPEN || 1;
            window.WebSocket.CLOSED = OrigWebSocket.CLOSED || 3;
            window.WebSocket.CLOSING = OrigWebSocket.CLOSING || 2;
            window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING || 0;
          }
          window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason && (
              (e.reason.message && e.reason.message.indexOf('WebSocket') !== -1) ||
              (e.reason.stack && e.reason.stack.indexOf('createWebSocketModuleRunnerTransport') !== -1)
            )) {
              e.preventDefault();
              e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
          });
          window.addEventListener('error', function(e) {
            if (e && (
              (e.message && e.message.indexOf('WebSocket') !== -1) ||
              (e.filename && e.filename.indexOf('@vite/client') !== -1)
            )) {
              e.preventDefault();
              e.stopImmediatePropagation && e.stopImmediatePropagation();
            }
          });
        } catch (_) {}
      })();
    </script>
